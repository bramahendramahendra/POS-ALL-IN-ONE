<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piutang — POS System</title>
    <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="logo">POS System</div>
        <nav>
            <a href="/dashboard.html">Dashboard</a>
            <a href="/kasir.html">Kasir</a>
            <a href="/products.html">Produk</a>
            <a href="/transactions.html">Transaksi</a>
            <a href="/finance.html">Keuangan</a>
            <a href="/customers.html">Pelanggan</a>
            <a href="/receivables.html" class="active">Piutang</a>
            <a href="/suppliers.html">Supplier</a>
            <a href="/shifts.html">Shift</a>
            <a href="/reports.html">Laporan</a>
            <a href="/sync-center.html">Sync Center</a>
            <a href="/settings.html">Pengaturan</a>
        </nav>
        <div style="margin-top:auto;padding:20px;">
            <button class="btn-secondary" id="btn-logout" style="width:100%">Logout</button>
        </div>
    </aside>
    <main class="main-content">
        <h1 class="page-title">Piutang</h1>
        <div class="card">
            <table>
                <thead><tr><th>Pelanggan</th><th>Jumlah</th><th>Jatuh Tempo</th><th>Status</th><th></th></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </main>
</div>
<script src="/src/js/api-client.js"></script>
<script src="/src/js/app.js"></script>
<script src="/src/js/auth.js"></script>
<script src="/src/js/router.js"></script>
<script>
    requireAuth();
    document.getElementById('btn-logout').addEventListener('click', logout);

    function fmt(n) { return 'Rp ' + Number(n).toLocaleString('id-ID'); }
    function fmtDate(s) { return s ? new Date(s).toLocaleDateString('id-ID') : '-'; }

    async function load() {
        try {
            const data = await apiClient.get('/receivables', { limit: 500 }) || [];
            document.getElementById('table-body').innerHTML = data.map(r => `
                <tr>
                    <td>${r.customer_name || '-'}</td>
                    <td>${fmt(r.amount)}</td>
                    <td>${fmtDate(r.due_date)}</td>
                    <td>${r.status}</td>
                    <td><button class="btn-secondary" onclick="alert('Bayar #${r.id}')">Bayar</button></td>
                </tr>`).join('');
        } catch (e) { console.error(e.message); }
    }

    load();
</script>
</body>
</html>
