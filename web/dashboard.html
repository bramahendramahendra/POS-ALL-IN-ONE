<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — POS System</title>
    <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="logo">POS System</div>
        <nav>
            <a href="/dashboard.html" class="active">Dashboard</a>
            <a href="/kasir.html">Kasir</a>
            <a href="/products.html">Produk</a>
            <a href="/transactions.html">Transaksi</a>
            <a href="/finance.html">Keuangan</a>
            <a href="/customers.html">Pelanggan</a>
            <a href="/receivables.html">Piutang</a>
            <a href="/suppliers.html">Supplier</a>
            <a href="/shifts.html">Shift</a>
            <a href="/reports.html">Laporan</a>
            <a href="/sync-center.html">Sync Center</a>
            <a href="/settings.html">Pengaturan</a>
        </nav>
        <div style="margin-top:auto;padding:20px;">
            <button class="btn-secondary" id="btn-logout" style="width:100%">Logout</button>
        </div>
    </aside>
    <main class="main-content">
        <h1 class="page-title">Dashboard</h1>
        <div id="stats-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;"></div>
    </main>
</div>

<script src="/src/js/api-client.js"></script>
<script src="/src/js/app.js"></script>
<script src="/src/js/auth.js"></script>
<script src="/src/js/router.js"></script>
<script>
    requireAuth();

    document.getElementById('btn-logout').addEventListener('click', logout);

    async function loadStats() {
        try {
            const data = await apiClient.get('/dashboard/summary');
            const grid = document.getElementById('stats-grid');
            const items = [
                { label: 'Penjualan Hari Ini', value: 'Rp ' + (data?.sales_today ?? 0).toLocaleString('id-ID') },
                { label: 'Transaksi Hari Ini', value: data?.transactions_today ?? 0 },
                { label: 'Produk Aktif', value: data?.active_products ?? 0 },
                { label: 'Pelanggan', value: data?.total_customers ?? 0 },
            ];
            grid.innerHTML = items.map(i => `
                <div class="card">
                    <div style="font-size:13px;color:#6b7280">${i.label}</div>
                    <div style="font-size:24px;font-weight:700;margin-top:8px">${i.value}</div>
                </div>`).join('');
        } catch (e) {
            console.error('Dashboard load error:', e.message);
        }
    }

    loadStats();
</script>
</body>
</html>
