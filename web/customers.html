<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelanggan — POS System</title>
    <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="logo">POS System</div>
        <nav>
            <a href="/dashboard.html">Dashboard</a>
            <a href="/kasir.html">Kasir</a>
            <a href="/products.html">Produk</a>
            <a href="/transactions.html">Transaksi</a>
            <a href="/finance.html">Keuangan</a>
            <a href="/customers.html" class="active">Pelanggan</a>
            <a href="/receivables.html">Piutang</a>
            <a href="/suppliers.html">Supplier</a>
            <a href="/shifts.html">Shift</a>
            <a href="/reports.html">Laporan</a>
            <a href="/sync-center.html">Sync Center</a>
            <a href="/settings.html">Pengaturan</a>
        </nav>
        <div style="margin-top:auto;padding:20px;">
            <button class="btn-secondary" id="btn-logout" style="width:100%">Logout</button>
        </div>
    </aside>
    <main class="main-content">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <h1 class="page-title" style="margin:0">Pelanggan</h1>
            <button class="btn-primary" onclick="alert('Tambah pelanggan — coming soon')">+ Tambah</button>
        </div>
        <div class="card">
            <input type="text" id="search" placeholder="Cari pelanggan..." style="max-width:300px;margin-bottom:16px">
            <table>
                <thead><tr><th>Nama</th><th>Telepon</th><th>Email</th><th>Total Transaksi</th><th></th></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </main>
</div>
<script src="/src/js/api-client.js"></script>
<script src="/src/js/app.js"></script>
<script src="/src/js/auth.js"></script>
<script src="/src/js/router.js"></script>
<script>
    requireAuth();
    document.getElementById('btn-logout').addEventListener('click', logout);

    let customers = [];
    function fmt(n) { return 'Rp ' + Number(n).toLocaleString('id-ID'); }

    async function load() {
        try {
            customers = await apiClient.get('/customers', { limit: 500 }) || [];
            render(customers);
        } catch (e) { console.error(e.message); }
    }

    function render(list) {
        document.getElementById('table-body').innerHTML = list.map(c => `
            <tr>
                <td>${c.name}</td>
                <td>${c.phone || '-'}</td>
                <td>${c.email || '-'}</td>
                <td>${fmt(c.total_spent || 0)}</td>
                <td><button class="btn-secondary" onclick="alert('Detail #${c.id}')">Detail</button></td>
            </tr>`).join('');
    }

    document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        render(customers.filter(c => c.name.toLowerCase().includes(q) || (c.phone||'').includes(q)));
    });

    load();
</script>
</body>
</html>
