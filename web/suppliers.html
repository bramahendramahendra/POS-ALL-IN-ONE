<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier — POS System</title>
    <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="logo">POS System</div>
        <nav>
            <a href="/dashboard.html">Dashboard</a>
            <a href="/kasir.html">Kasir</a>
            <a href="/products.html">Produk</a>
            <a href="/transactions.html">Transaksi</a>
            <a href="/finance.html">Keuangan</a>
            <a href="/customers.html">Pelanggan</a>
            <a href="/receivables.html">Piutang</a>
            <a href="/suppliers.html" class="active">Supplier</a>
            <a href="/shifts.html">Shift</a>
            <a href="/reports.html">Laporan</a>
            <a href="/sync-center.html">Sync Center</a>
            <a href="/settings.html">Pengaturan</a>
        </nav>
        <div style="margin-top:auto;padding:20px;">
            <button class="btn-secondary" id="btn-logout" style="width:100%">Logout</button>
        </div>
    </aside>
    <main class="main-content">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <h1 class="page-title" style="margin:0">Supplier</h1>
            <button class="btn-primary" onclick="alert('Tambah supplier — coming soon')">+ Tambah</button>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Nama</th><th>Telepon</th><th>Alamat</th><th>Kontak</th><th></th></tr></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </main>
</div>
<script src="/src/js/api-client.js"></script>
<script src="/src/js/app.js"></script>
<script src="/src/js/auth.js"></script>
<script src="/src/js/router.js"></script>
<script>
    requireAuth();
    document.getElementById('btn-logout').addEventListener('click', logout);

    async function load() {
        try {
            const data = await apiClient.get('/suppliers', { limit: 500 }) || [];
            document.getElementById('table-body').innerHTML = data.map(s => `
                <tr>
                    <td>${s.name}</td>
                    <td>${s.phone || '-'}</td>
                    <td>${s.address || '-'}</td>
                    <td>${s.contact_person || '-'}</td>
                    <td><button class="btn-secondary" onclick="alert('Edit #${s.id}')">Edit</button></td>
                </tr>`).join('');
        } catch (e) { console.error(e.message); }
    }

    load();
</script>
</body>
</html>
