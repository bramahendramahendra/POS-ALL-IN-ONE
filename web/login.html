<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — POS System</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; }
        .login-box { width: 360px; }
        .login-box h1 { font-size: 24px; margin-bottom: 24px; text-align: center; color: #1e293b; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .btn-login { width: 100%; padding: 10px; font-size: 15px; margin-top: 8px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="card login-box">
    <h1>POS System</h1>
    <form id="login-form" novalidate>
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Masukkan username" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary btn-login" id="btn-login">Masuk</button>
        <div class="alert-error hidden" id="error-msg"></div>
    </form>
</div>

<script src="/src/js/api-client.js"></script>
<script src="/src/js/app.js"></script>
<script src="/src/js/auth.js"></script>
<script>
    if (localStorage.getItem('access_token')) {
        window.location.href = '/dashboard.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('error-msg');
        errEl.classList.add('hidden');
        document.getElementById('btn-login').disabled = true;
        document.getElementById('btn-login').textContent = 'Memproses...';

        try {
            await login(
                document.getElementById('username').value.trim(),
                document.getElementById('password').value
            );
        } catch (err) {
            errEl.textContent = err.message || 'Login gagal';
            errEl.classList.remove('hidden');
            document.getElementById('btn-login').disabled = false;
            document.getElementById('btn-login').textContent = 'Masuk';
        }
    });
</script>
</body>
</html>
