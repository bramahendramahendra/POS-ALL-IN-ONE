<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — POS System</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; }
        .login-box { width: 360px; }
        .login-box h1 { font-size: 24px; margin-bottom: 24px; text-align: center; color: #1e293b; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .btn-login { width: 100%; padding: 10px; font-size: 15px; margin-top: 8px; }
        #error-msg { margin-top: 12px; display: none; }
    </style>
</head>
<body>
<div class="card login-box">
    <h1>POS System</h1>
    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukkan username" autocomplete="username">
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password">
    </div>
    <button class="btn-primary btn-login" id="btn-login">Masuk</button>
    <div class="alert-error" id="error-msg"></div>
</div>

<script src="/src/js/api-client.js"></script>
<script src="/src/js/app.js"></script>
<script src="/src/js/auth.js"></script>
<script>
    // Jika sudah login, langsung ke dashboard
    if (localStorage.getItem('access_token')) window.location.href = '/dashboard.html';

    document.getElementById('btn-login').addEventListener('click', async () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errEl = document.getElementById('error-msg');
        errEl.style.display = 'none';

        if (!username || !password) {
            errEl.textContent = 'Username dan password wajib diisi.';
            errEl.style.display = 'block';
            return;
        }

        try {
            await login(username, password);
            window.location.href = '/dashboard.html';
        } catch (e) {
            errEl.textContent = e.message;
            errEl.style.display = 'block';
        }
    });

    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('btn-login').click();
    });
</script>
</body>
</html>
