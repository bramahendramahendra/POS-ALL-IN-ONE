name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch: # trigger manual dari GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: android/package-lock.json

      - name: Install Node dependencies
        working-directory: android
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        working-directory: android
        run: npx cap sync android

      - name: Grant Gradle execute permission
        working-directory: android/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-debug-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Get version info
        id: version
        working-directory: android
        run: |
          VERSION=$(node -e "const c=require('./capacitor.config.json'); console.log(c.appName)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release (jika tag versi)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android/android/app/build/outputs/apk/debug/app-debug.apk
          name: "POS System ${{ github.ref_name }}"
          body: "Debug APK build dari tag ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
